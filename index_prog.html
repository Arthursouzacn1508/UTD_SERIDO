<!doctype html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='description' content='Programacao STC'>
<title>PROGRAMAÇÃO STC</title>
<script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'></script>
<script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'></script>
<script>
const firebaseConfig={
apiKey:'AIzaSyAgFRfZanBfDCK79eWEMWONEg-oppkB2as',
authDomain:'programacao-stc.firebaseapp.com',
projectId:'programacao-stc',
storageBucket:'programacao-stc.firebasestorage.app',
messagingSenderId:'557076940494',
appId:'1:557076940494:web:366e4432084a50f8aef29f'
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
</script>
<style>
:root{--verde:#00A443;--verde-escuro:#007B32;--verde-claro:#E8F8EF;--azul:#0DA9FE;--azul-claro:#E7F6FF;--branco:#fff;--fundo:#F3F7F5;--texto:#17372C;--texto-secundario:#65746F;--borda:#DCE7E2;--vermelho:#E9473F;--amarelo:#F2C84B;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(180deg,#EDF8F2 0,var(--fundo) 320px);margin:0;color:var(--texto);min-height:100vh}button{font:inherit}
.app{width:100%;max-width:520px;min-height:100vh;margin:0 auto;background:var(--fundo);box-shadow:0 0 35px rgba(20,66,49,.10);overflow:hidden}
.topbar,.detailHead{position:relative;min-height:104px;background:linear-gradient(125deg,var(--verde-escuro) 0%,var(--verde) 58%,#08B85A 100%);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding:18px 100px 18px 20px;overflow:hidden}
.topbar:after,.detailHead:after{content:'';position:absolute;width:105px;height:105px;right:-55px;top:-62px;border:20px solid rgba(13,169,254,.18);border-radius:50%}
.headText{position:relative;z-index:2;flex:1;text-align:left;line-height:1.15;min-width:0}.headTitle,.detailTitle{position:relative;z-index:2;font-size:25px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.headSub{display:none!important}
.portalBtn,.backBtn{position:absolute;z-index:4;right:17px;top:50%;transform:translateY(-50%);width:66px;min-height:63px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;background:transparent;border:0;border-radius:12px;color:#fff;text-decoration:none;text-align:center;font-size:12px;font-weight:900;cursor:pointer}.portalBtn:hover,.backBtn:hover{background:rgba(255,255,255,.16)}.homeIcon{width:29px;height:29px;display:block;fill:#fff}
.summaryWrap{padding:10px 16px 19px}.loading,.empty{padding:32px 16px;text-align:center;color:var(--texto-secundario);font-weight:700}.empty{display:none}
.teamCard{position:relative;overflow:hidden;background:#fff;border:1px solid var(--borda);border-top:4px solid var(--verde);border-radius:18px;padding:16px 16px 13px;margin:10px 0 14px;box-shadow:0 7px 21px rgba(20,66,49,.09);cursor:pointer;transition:.22s}.teamCard:hover{transform:translateY(-3px);border-color:var(--verde);box-shadow:0 13px 28px rgba(20,66,49,.15)}
.teamTop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}.teamName{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamActivity{font-size:15px;font-weight:900;text-align:right;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.teamStats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.statBox{background:var(--verde-claro);border-radius:10px;text-align:center;padding:9px 3px 7px;color:var(--verde-escuro);font-size:18px;font-weight:900;line-height:1}.statBox span{display:block;color:var(--texto);font-size:10px;font-weight:500;margin-top:6px}.statBox.venc{background:#FDEBE9;color:var(--vermelho)}
.teamFooter{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.teamTotal{font-size:13px;font-weight:800;color:var(--verde-escuro);white-space:nowrap}.teamMembers{font-size:12px;color:var(--texto-secundario);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:255px}
.teamLine{display:flex;justify-content:flex-end;align-items:center;padding:13px 20px 5px}.teamLine span{color:var(--verde-escuro);background:var(--verde-claro);padding:6px 10px;border-radius:50px;font-size:12px;font-weight:800}.cardsWrap{padding:0 16px 20px}
.card{background:#fff;border:1px solid var(--borda);border-top:4px solid var(--azul);border-radius:18px;padding:17px 17px 15px;margin:10px 0 16px;box-shadow:0 7px 20px rgba(20,66,49,.09);font-size:14px}.nota{font-size:17px;font-weight:900}.servico{font-size:12px;margin-top:3px;color:var(--texto-secundario)}.cidade{font-size:15px;margin-top:12px}.rua{font-size:14px;margin-top:3px;color:var(--texto-secundario);line-height:1.4}
.pillRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pill{background:var(--azul-claro);color:#075D89;border-radius:8px;padding:8px 11px;font-size:12px}.pill.md,.pill.cargaAlta{background:var(--vermelho);color:#fff;font-weight:900}.medidor{font-size:12px;font-weight:900;margin-top:13px;text-transform:uppercase}.dateStatus{margin-top:11px;border-radius:9px;padding:9px;text-align:center;font-size:13px;font-weight:800}.dateStatus.due{background:var(--vermelho);color:#fff}.dateStatus.next{background:var(--amarelo);color:#000}.dateStatus.normal{background:var(--verde-claro);color:var(--verde-escuro)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.btn{border:0;border-radius:10px;padding:10px 6px;font-size:13px;font-weight:900;cursor:pointer;transition:.18s}.btn:hover{filter:brightness(.96);transform:translateY(-1px)}.btn.ghost{background:var(--verde-claro);color:var(--verde-escuro)}.btn.ok{background:var(--verde);color:#fff}.btn:disabled{opacity:.65;cursor:wait}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.modal-content{background:#fff;border-radius:18px;width:100%;max-width:470px;max-height:82vh;overflow:auto;padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.30)}.modal h3{margin:0 0 14px;color:var(--verde-escuro);font-size:20px}.modal p{margin:8px 0;font-size:14px;line-height:1.45}.modalClose{margin-top:15px;width:100%;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:900;cursor:pointer}
@media(max-width:430px){.app{max-width:100%}.topbar,.detailHead{min-height:96px;padding:16px 86px 16px 15px}.headTitle,.detailTitle{font-size:21px}.headSub{font-size:9px}.portalBtn,.backBtn{right:8px;width:60px;font-size:11px}.summaryWrap,.cardsWrap{padding-left:11px;padding-right:11px}.teamCard{padding:14px 12px 12px}.teamName{font-size:16px}.teamActivity{font-size:13px;max-width:145px}.statBox{font-size:16px}.teamMembers{max-width:190px}}
@media(max-width:350px){.topbar,.detailHead{padding-right:76px}.portalBtn,.backBtn{right:6px;width:53px;font-size:10px}.headTitle,.detailTitle{font-size:18px}.teamStats{gap:4px}.statBox{font-size:15px;padding-left:1px;padding-right:1px}.teamActivity{max-width:110px}}@media(min-width:700px){.app{margin:12px auto;border-radius:22px;min-height:calc(100vh - 24px)}}
</style>
</head>
<body>
<div class='app'>
<section id='viewResumo'>
<div class='topbar'><div class='headText'><div class='headTitle'>PROGRAMAÇÃO STC</div><div class='headSub' id='dataHoraAtual'>Carregando atualização...</div></div>
<a class='portalBtn' href='index.html' aria-label='Voltar ao Portal'><svg class='homeIcon' viewBox='0 0 24 24'><path d='M12 2.5L2.5 10.4V21h6.2v-6.3h6.6V21h6.2V10.4z'></path></svg><span>Voltar</span></a></div>
<div id='loading' class='loading'>Carregando programação...</div><div id='summaryWrap' class='summaryWrap'></div><div id='emptyResumo' class='empty'>Nenhuma nota aberta encontrada.</div>
</section>
<section id='viewDetalhe' style='display:none'><div class='detailHead'><div class='detailTitle' id='equipeSelecionada'></div><button type='button' class='backBtn' onclick='voltarResumo()'><svg class='homeIcon' viewBox='0 0 24 24'><path d='M12 2.5L2.5 10.4V21h6.2v-6.3h6.6V21h6.2V10.4z'></path></svg><span>Voltar</span></button></div><div class='teamLine'><span id='qtdEquipe'></span></div><div id='cards' class='cardsWrap'></div><div id='emptyEquipe' class='empty'>Nenhuma nota aberta para esta equipe.</div></section>
<script>
var allData=[];var equipeAtual='';
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function somenteDataBR(s){s=String(s||'').trim();var m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return '';return String(m[1]).padStart(2,'0')+'/'+String(m[2]).padStart(2,'0')+'/'+m[3];}
function dateInfo(s){s=somenteDataBR(s);if(!s)return{ord:99999,cls:'normal',label:'Sem data'};var p=s.split('/');var d=new Date(+p[2],+p[1]-1,+p[0]);var h=new Date();h.setHours(0,0,0,0);d.setHours(0,0,0,0);var diff=Math.round((d-h)/86400000);if(diff===0)return{ord:0,cls:'due',label:'Hoje - '+s};if(diff===1)return{ord:1,cls:'next',label:'Amanhã - '+s};return{ord:diff<0?2:diff+10,cls:'normal',label:s};}
function abertas(){return allData.filter(function(x){return norm(x.status)!=='CONCLUIDO';});}
db.collection('programacao_stc').onSnapshot(function(snapshot){allData=[];snapshot.forEach(function(doc){var x=doc.data();x.nota=x.nota||doc.id;x.docId=doc.id;allData.push(x);});document.getElementById('loading').style.display='none';atualizarCabecalho();renderResumo();if(equipeAtual)renderEquipe(equipeAtual);},function(err){console.error(err);document.getElementById('loading').textContent='Erro ao carregar os dados. Verifique a conexão.';});
function atualizarCabecalho(){var txt='';allData.some(function(x){if(x.atualizacaoCarteira){txt=x.atualizacaoCarteira;return true;}return false;});document.getElementById('dataHoraAtual').textContent=txt?'Última atualização: '+txt:'Programação sem registros';}
function renderResumo(){var wrap=document.getElementById('summaryWrap');var vazia=document.getElementById('emptyResumo');var lista=abertas();var mapa={};
lista.forEach(function(x){var eq=String(x.equipe||'').trim();if(!eq)return;if(!mapa[eq])mapa[eq]={equipe:eq,atividade:x.atividade||'',membro1:x.membro1||'',membro2:x.membro2||'',total:0,venc:0,trif:0,mono:0,md:0};
var g=mapa[eq];g.total++;if(dateInfo(x.venc).ord===0)g.venc++;if(norm(x.para)==='TRIF')g.trif++;if(norm(x.para)==='MONO')g.mono++;if(String(x.md200a||'0')==='1')g.md++;
if(!g.atividade&&x.atividade)g.atividade=x.atividade;if(!g.membro1&&x.membro1)g.membro1=x.membro1;if(!g.membro2&&x.membro2)g.membro2=x.membro2;});
var equipes=Object.keys(mapa).sort(function(a,b){return a.localeCompare(b,'pt-BR');});var out='';equipes.forEach(function(eq){var g=mapa[eq];var membros=[g.membro1,g.membro2].filter(Boolean).join(' / ');
out+=`<div class='teamCard' data-equipe='${esc(eq)}'><div class='teamTop'><div class='teamName'>${esc(eq)}</div><div class='teamActivity'>${esc(g.atividade)}</div></div><div class='teamStats'>`;
out+=`<div class='statBox venc'>${g.venc}<span>Venc/dia</span></div><div class='statBox'>${g.trif}<span>Trif</span></div><div class='statBox'>${g.mono}<span>Mono</span></div><div class='statBox'>${g.md}<span>200A</span></div></div>`;
out+=`<div class='teamFooter'><div class='teamTotal'>${g.total} notas</div><div class='teamMembers'>${esc(membros)}</div></div></div>`;});wrap.innerHTML=out;vazia.style.display=equipes.length?'none':'block';
wrap.querySelectorAll('.teamCard').forEach(function(card){card.onclick=function(){abrirEquipe(card.dataset.equipe);};});}
function abrirEquipe(eq){equipeAtual=eq;document.getElementById('viewResumo').style.display='none';document.getElementById('viewDetalhe').style.display='block';renderEquipe(eq);window.scrollTo(0,0);}
function voltarResumo(){equipeAtual='';document.getElementById('viewDetalhe').style.display='none';document.getElementById('viewResumo').style.display='block';renderResumo();window.scrollTo(0,0);}
function renderEquipe(eq){var lista=abertas().filter(function(x){return String(x.equipe||'')===eq;});lista.sort(function(a,b){return dateInfo(a.venc).ord-dateInfo(b.venc).ord;});
document.getElementById('equipeSelecionada').textContent=eq;document.getElementById('qtdEquipe').textContent=lista.length+' notas';var cards=document.getElementById('cards');var vazio=document.getElementById('emptyEquipe');var out='';
lista.forEach(function(it){var dt=dateInfo(it.venc);var cargaNum=parseFloat(String(it.carga||'0').replace(',','.'));var classeCarga=cargaNum>=66.1?' cargaAlta':'';
out+=`<div class='card' data-docid='${esc(it.docId)}'><div class='nota'>${esc(it.nota||'—')}</div><div class='servico'>${esc(it.tipo||'')}</div><div class='cidade'><b>${esc(it.cidade||'')}</b> • ${esc(it.bairro||'')}</div><div class='rua'>${esc(it.rua||'')}</div>`;
out+=`<div class='pillRow'><div class='pill'>${esc(it.de||'')} &gt; ${esc(it.para||'')}</div><div class='pill${classeCarga}'>Carga: ${esc(it.carga||'—')}</div>${String(it.md200a||'0')==='1'?`<div class='pill md'>MD 200A</div>`:''}</div>`;
out+=`<div class='medidor'>MEDIDOR A SER UTILIZADO: ${esc(it.medidorUso||'—')}</div><div class='dateStatus ${dt.cls}'>${esc(dt.label)}</div><div class='actions'><button class='btn ghost' type='button'>Detalhes</button><button class='btn ok' type='button'>Concluído</button></div></div>`;});
cards.innerHTML=out;vazio.style.display=lista.length?'none':'block';cards.querySelectorAll('.card').forEach(function(card){var it=lista.find(function(x){return x.docId===card.dataset.docid;});card.querySelector('.ghost').onclick=function(){showModal(it);};card.querySelector('.ok').onclick=function(){concluirNota(it,this);};});}
function concluirNota(it,btn){if(!it||!confirm('Marcar a nota '+it.nota+' como concluída?'))return;btn.disabled=true;btn.textContent='Salvando...';db.collection('programacao_stc').doc(String(it.docId)).set({status:'concluido',concluidoPor:String(it.equipe||''),concluidoEm:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(err){console.error(err);alert('Erro ao salvar. Verifique a internet e tente novamente.');btn.disabled=false;btn.textContent='Concluído';});}
function showModal(it){if(!it)return;var m=document.createElement('div');m.className='modal';var c=document.createElement('div');c.className='modal-content';var h=`<h3>Nota ${esc(it.nota||'')}</h3>`;function add(l,v){if(v)h+=`<p><b>${esc(l)}: </b>${esc(v)}</p>`;}add('Equipe',it.equipe);add('Atividade',it.atividade);add('Tipo de Serviço',it.tipo);add('Data de Vencimento',it.venc);add('Cidade',it.cidade);add('Bairro',it.bairro);add('Rua',it.rua);add('Carga',it.carga);add('MEDIDOR A SER UTILIZADO',it.medidorUso);add('De',it.de);add('Para',it.para);add('Cabo Cliente',it.caboCliente);add('Cabo Cosern',it.caboCosern);add('Disjuntor',it.disjuntor);add('Medidor atual',it.medidorAtual);if(String(it.md200a||'0')==='1')add('MD200A','Sim');h+=`<button class='modalClose'>Fechar</button>`;c.innerHTML=h;m.appendChild(c);document.body.appendChild(m);c.querySelector('.modalClose').onclick=function(){m.remove();};m.onclick=function(e){if(e.target===m)m.remove();};}
</script>
</div>
</body>
</html>
